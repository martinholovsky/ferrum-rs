[package]
name = "corten-std"
description = "Corten's capability-oriented prelude: DirCap, typed sinks, Secret, signed manifest, misuse-resistant crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Every dependency is part of Corten's trusted base (docs/tcb.md). Kept to
# crates that need no `unsafe` from us and pass deny.toml.
[dependencies]
# Cryptography and randomness (Phase 6, batch 5; spec section 8, question 13,
# owner decision 2026-11-01; review in docs/gates/phase-6.md). Default
# features off: no library-generated salts or nonces from another source.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["std"] }
getrandom = "0.4.3"
region = "3.0.2"
subtle = "2.6.1"
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "rand"] }

[lints]
workspace = true
